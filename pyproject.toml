[project]
name = "amazon-ml-challenge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anyascii>=0.3.3",
    "ftfy>=6.3.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
    "sparse-dot-topn>=1.2.0",
    "scikit-learn>=1.9.1",
    "lightgbm>=4.7.0",
    "xgboost>=2.1.0",
    "catboost>=1.2.7",
    "optuna>=5.0.0",
]

[dependency-groups]
# optional: frozen multilingual-E5 similarity + sparse-autoencoder analysis (GPU instance recommended)
neural = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
]
# optional: UMAP instead of the PCA→t-SNE fallback for feature-space plots
viz = [
    "umap-learn>=0.5.6",
]
dev = [
    "pytest>=8.0",
    "ipykernel>=7.3.0",
    "papermill>=2.7.0",
]
